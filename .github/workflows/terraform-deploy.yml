name: Terraform deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_sql_administrator_name: ${{ vars.SQL_ADMINISTRATOR_NAME }}
      TF_VAR_sql_administrator_object_id: ${{ vars.SQL_ADMINISTRATOR_OBJECT_ID }}
      TF_VAR_sql_administrator_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_alert_email_addresses: ${{ vars.ALERT_EMAIL_ADDRESSES || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=ramcollins/${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Create plan
        run: terraform plan -input=false -no-color -var-file="environments/${{ inputs.environment }}/terraform.tfvars" -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=ramcollins/${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}

      - name: Apply reviewed plan
        env:
          TF_VAR_sql_administrator_name: ${{ vars.SQL_ADMINISTRATOR_NAME }}
          TF_VAR_sql_administrator_object_id: ${{ vars.SQL_ADMINISTRATOR_OBJECT_ID }}
          TF_VAR_sql_administrator_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_alert_email_addresses: ${{ vars.ALERT_EMAIL_ADDRESSES || '[]' }}
        run: terraform apply -input=false tfplan
