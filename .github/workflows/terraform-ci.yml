name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -recursive -check

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Validate remote-state bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate -no-color

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Ledger is not supported by the pinned AzureRM provider. Zone redundancy
          # is tier-dependent; the dev/test DTU SKUs cannot enable it. Remaining
          # exclusions are cross-resource or externally managed controls.
          skip_check: CKV_AZURE_224,CKV_AZURE_229,CKV2_AZURE_1,CKV2_AZURE_2,CKV2_AZURE_21,CKV2_AZURE_32,CKV2_AZURE_33,CKV2_AZURE_45
